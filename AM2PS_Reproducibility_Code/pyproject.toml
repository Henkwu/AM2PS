[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "am2ps-repro"
version = "0.1.0"
description = "Reference implementation for Adaptive Multi-Prompt and Multi-Scale Feature Fusion (AM2PS) for pneumonia diagnosis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "torchvision>=0.17",
  "open_clip_torch>=2.24",
  "numpy>=1.24",
  "scikit-learn>=1.3",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "Pillow>=10.0",
  "matplotlib>=3.8"
]

[tool.setuptools.packages.find]
include = ["am2ps*"]

name: smoke-test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install torch torchvision numpy scikit-learn pandas PyYAML tqdm Pillow matplotlib
      - run: python tests/smoke_test.py

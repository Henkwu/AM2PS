seed: 42
output_dir: outputs/chestxray2017_full

data:
  root: data/ChestXRay2017/chest_xray
  train_dir: train
  val_dir: val
  test_dir: test
  image_size: 224  # paper does not explicitly state input size; 224 matches CLIP ViT-B/32 default
  rotation_degrees: 10.0  # implementation choice; magnitude not specified in paper
  color_jitter: 0.10      # implementation choice; magnitude not specified in paper

loader:
  batch_size: 16          # implementation choice; batch size not reported in paper
  num_workers: 4
  pin_memory: true

components:
  data_augmentation: true
  multi_prompt: true
  multi_scale: true
  scalable_adapter: true

model:
  embed_dim: 512
  resnet_pretrained: true
  clip_backend: open_clip
  clip_model: ViT-B-32
  clip_pretrained: openai
  adapter_hidden_dim: 256  # implementation choice for the reported 2-layer adapter
  num_scales: 3
  transformer_layers: 3
  num_heads: 8
  alpha: [0.3333333333, 0.3333333333, 0.3333333333]
  lambda1: 1.0
  lambda2: 1.0
  inter_modal_mode: mean_class_probs
  normalize_probability_fusion: true
  prompts:
    - "a photo of a {class}"
    - "a clinical photo of a {class}"
    - "a chest X-ray photo of a {class}"

training:
  epochs: 60
  lr: 0.0002
  weight_decay: 0.0001
  amp: true
